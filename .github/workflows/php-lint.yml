name: PHP Lint

on:
  push:

jobs:
  php-lint:
    name: php -l
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint PHP files
        run: |
          find . \
            -path ./vendor -prune -o \
            -path ./.git -prune -o \
            -name '*.php' -print0 \
            | xargs -0 -n 1 php -l
